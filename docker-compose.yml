# Joris' Claude-Server – läuft getrennt neben JARVIS (eigenes Compose-Projekt "claude-server").
name: claude-server
services:
  bridge:
    build: ./bridge
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
      - APP_DIR=/app
      - TZ=Europe/Berlin
    volumes:
      - ./data:/data
      - ./:/app
    shm_size: "1gb"
    expose: ["8000"]
  webdav:
    image: rclone/rclone:latest
    restart: unless-stopped
    command: serve webdav /data/obsidian --addr :8080 --baseurl /dav --user "${DAV_USER}" --pass "${DAV_PASS}"
    volumes:
      - ./data:/data
  syncthing:
    # Datei-Sync zwischen Mac, PC und Server (Ordner /data/sync)
    image: syncthing/syncthing:latest
    restart: unless-stopped
    hostname: joris-server
    environment:
      - PUID=0
      - PGID=0
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - ./data/syncthing:/var/syncthing/config
      - ./data/sync:/var/syncthing/sync
    ports:
      - "${BIND_IP:-0.0.0.0}:22000:22000/tcp"
      - "${BIND_IP:-0.0.0.0}:22000:22000/udp"
  playwright:
    # Offizieller Playwright-MCP (Microsoft) als eigener Connector, nur über Caddy mit Token-Pfad erreichbar
    image: mcr.microsoft.com/playwright/mcp:latest
    restart: unless-stopped
    command: ["--headless", "--isolated", "--host", "0.0.0.0", "--port", "8931", "--allowed-hosts", "*"]
    mem_limit: 1g
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN=${DOMAIN}
      - BRIDGE_TOKEN=${BRIDGE_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data: {}
  caddy_config: {}
